plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dijitalkutuphanem.widget'
    compileSdk 34

    defaultConfig {
        applicationId "com.dijitalkutuphanem.widget"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Hafif ve hızlı çalışma için ek ağır kütüphane gerektirmez
}

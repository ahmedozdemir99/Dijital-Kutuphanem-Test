    <script>
      (function() {
        // Prevent benign Vite HMR "WebSocket closed without opened" in preview environment
        try {
          const OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              const ws = new OrigWebSocket(url, protocols);
              let hasOpened = false;
              ws.addEventListener('open', function() {
                hasOpened = true;
              }, { capture: true });
              ws.addEventListener('close', function() {
                if (!hasOpened) {
                  hasOpened = true;
                  try {
                    ws.dispatchEvent(new Event('open'));
                  } catch (err) {}
                }
              }, { capture: true });
              return ws;
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
            window.WebSocket.OPEN = OrigWebSocket.OPEN;
            window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
            window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
          }
        } catch (e) {}

        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('@vite/client'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
          if (typeof reason === 'string' && (reason.includes('WebSocket') || reason.includes('@vite/client'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
